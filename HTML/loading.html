<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=/FEE_project/HTML/index.html">
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
    <link rel="stylesheet" href="../CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Loading - PulseWave</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loading-container {
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
            text-align: center;
        }

        .loading-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .loading-logo img {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 12px rgba(255, 0, 128, 0.4));
        }

        .loading-logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .loading-logo .pulse-text {
            background: linear-gradient(135deg, #7928CA, #FF0080, #00DFD8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loading-section {
            background-color: #181818;
            border-radius: 10px;
            padding: 3rem;
            margin-bottom: 2rem;
        }

        .loading-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .loading-description {
            color: #B3B3B3;
            margin-bottom: 2rem;
        }

        .loading-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .loading-card {
            background-color: #282828;
            border-radius: 8px;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .loading-card:hover {
            background-color: #333333;
            transform: translateY(-5px);
        }

        .loading-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .loading-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .loading-card p {
            font-size: 0.85rem;
            color: #B3B3B3;
        }

        .loading-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .loading-stat {
            background-color: #181818;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
        }

        .loading-stat i {
            font-size: 2.5rem;
            color: #00DFD8;
            margin-bottom: 1rem;
        }

        .loading-stat h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .loading-stat p {
            color: #B3B3B3;
            font-size: 0.9rem;
        }

        .progress-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #282828;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7928CA, #FF0080, #00DFD8);
            border-radius: 4px;
            width: 0%;
            animation: progress 5s linear forwards;
            box-shadow: 0 0 12px rgba(0, 223, 216, 0.6);
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 500;
            color: #B3B3B3;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .loading-status {
            font-size: 1.2rem;
            font-weight: 600;
            color: #B3B3B3;
        }

        @media (max-width: 768px) {
            .loading-title {
                font-size: 1.5rem;
            }

            .loading-preview {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 1rem;
            }

            .loading-section {
                padding: 2rem 1rem;
            }

            .loading-stats {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <a href="index.html" class="loading-logo" style="text-decoration: none; color: inherit; cursor: pointer;">
            <img src="../assets/logo.svg" alt="PulseWave Logo">
            <h1><span class="pulse-text">Pulse</span>Wave</h1>
        </a>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="loading-text">loading...</div>
        </div>

        <div class="loading-stats">
            <div class="loading-stat">
                <i class="fas fa-music"></i>
                <h3>70M+</h3>
                <p>Songs</p>
            </div>
            <div class="loading-stat">
                <i class="fas fa-users"></i>
                <h3>500M+</h3>
                <p>Users</p>
            </div>
            <div class="loading-stat">
                <i class="fas fa-globe"></i>
                <h3>190+</h3>
                <p>Countries</p>
            </div>
        </div>

        <div class="loading-section">
            <h2 class="loading-title">Featured Playlists</h2>
            <p class="loading-description">Loading your personalized recommendations</p>
            
            <div class="loading-preview">
                <div class="loading-card">
                    <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=500&q=80" alt="Playlist 1">
                    <h3>Chill Vibes</h3>
                    <p>Relaxing music for your day</p>
                </div>
                <div class="loading-card">
                    <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=500&q=80" alt="Playlist 2">
                    <h3>Workout Energy</h3>
                    <p>High-energy beats</p>
                </div>
                <div class="loading-card">
                    <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=500&q=80" alt="Playlist 3">
                    <h3>Late Night Hits</h3>
                    <p>Popular night tracks</p>
                </div>
            </div>
        </div>

        <div class="loading-status">
            Please wait while we load your music experience
        </div>
    </div>
    <script src="../JS/app.js"></script>
</body>
</html>
