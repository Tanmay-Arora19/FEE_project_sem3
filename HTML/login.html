<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PulseWave</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at top, #241432 0%, #121218 60%, #0a0a0e 100%);
        }
        .auth-box {
            background: #181818;
            padding: 3rem;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-box h1 {
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .auth-form input {
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: #282828;
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: box-shadow 0.3s;
        }
        .auth-form input:focus {
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
        }
        .auth-form button {
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: #1DB954;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .auth-form button:hover {
            background: #1ed760;
            transform: scale(1.02);
        }
        .auth-switch {
            margin-top: 1.5rem;
            color: #b3b3b3;
        }
        .auth-switch a {
            color: #1DB954;
            font-weight: 600;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 1rem; text-decoration: none; color: inherit;">
                <img src="../assets/logo.svg" alt="PulseWave Logo" width="44">
                <h2>PulseWave</h2>
            </a>
            <h1>Log in</h1>
            <form class="auth-form" id="loginForm">
                <input type="text" id="loginName" placeholder="Username or Name" required>
                <input type="password" id="loginPass" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <div class="auth-switch">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
            <div style="margin-top: 1rem;">
                <a href="index.html" style="color: #b3b3b3; font-size: 0.9rem;">Back to Home</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('loginName').value;
            localStorage.setItem('pulsewaveUser', JSON.stringify({ name }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
